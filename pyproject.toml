[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poppet-mcp"
version = "1.0.0"
description = "Typed MCP tool layer for Cascadeur 2026.2+ — drives the built-in MCP script server with a shipped in-app runtime, so there is nothing to install inside Cascadeur."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brandon Figarella" }]
keywords = ["mcp", "cascadeur", "animation", "claude", "autoposing", "autophysics", "autodesk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-mock>=3",
    "ruff>=0.5",
]

[project.scripts]
poppet-mcp = "poppet_mcp.server:main"

[project.urls]
Homepage = "https://github.com/figgiee/poppet"
Issues = "https://github.com/figgiee/poppet/issues"
Changelog = "https://github.com/figgiee/poppet/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/poppet_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/Makefile",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
# Both the MCP server and the in-app runtime execute on Python 3.11+:
# the MCP server runs wherever the user installed poppet, and Cascadeur
# 2026.2's embedded interpreter is CPython 3.11 (`python311.dll`).
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# The in-app runtime is shipped as source text and executed inside Cascadeur.
# It intentionally keeps a flat, defensive style; no import sorting needed there.
"src/poppet_mcp/runtime/inapp.py" = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
